<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b09">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=https://results.eb.org.au/2026/live-timing/6af3d7ce0ce856b4b908c691">
  <title>Opening Live Timing | Team Venom</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b09;color:#f3f6f3}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#132319 0%,#080b09 65%)}
    main{width:min(100%,520px);padding:42px 34px;text-align:center;border:1px solid #26372c;border-radius:22px;background:rgba(13,18,14,.94);box-shadow:0 24px 80px #0008}
    .mark{width:54px;height:54px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid #75e58a;border-radius:15px;color:#83f095;font-size:27px;font-weight:900}
    .eyebrow{margin:0 0 12px;color:#82e992;font-size:11px;font-weight:800;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(27px,6vw,38px);letter-spacing:-.04em}
    p.copy{margin:14px 0 26px;color:#aab5ac;line-height:1.6}
    .loader{width:25px;height:25px;margin:0 auto 22px;border:3px solid #314437;border-top-color:#83f095;border-radius:50%;animation:spin .8s linear infinite}
    a{display:inline-block;color:#91f19e;font-weight:700;text-decoration:none}
    a:hover{text-decoration:underline}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.loader{animation:none}}
  </style>
  <script>
    window.location.replace("https://results.eb.org.au/2026/live-timing/6af3d7ce0ce856b4b908c691");
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">V</div>
    <p class="eyebrow">TEAM VENOM · RACE OPERATIONS</p>
    <div class="loader" aria-hidden="true"></div>
    <h1>Opening live timing<span style="color:#83f095">.</span></h1>
    <p class="copy">Taking you to the Energy Breakthrough 2026 live results.</p>
    <a href="https://results.eb.org.au/2026/live-timing/6af3d7ce0ce856b4b908c691">Continue to live timing →</a>
  </main>
</body>
</html>
